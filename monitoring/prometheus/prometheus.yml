# Prometheus Configuration
# Scrapes metrics from Spring Boot application every 15 seconds
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'ecommerce-monitor'

# Scrape configuration
scrape_configs:
  # Spring Boot application metrics
  - job_name: 'spring-boot-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          application: 'ecommerce'
          environment: 'development'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

# Note for production:
# - Replace 'host.docker.internal:8080' with actual app hostname
# - Add more targets for multiple application instances (load balancing)
# - Configure alerting rules (Alertmanager)
# - Set up remote storage for long-term retention
