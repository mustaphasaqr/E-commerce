name: Frontend Integration Tests

on:
  push:
    branches:
      - feature/frontend-development
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-tests.yml'

jobs:
  # ==================== INTEGRATION TESTS ====================
  test-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install --legacy-peer-deps

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: 'Run Integration Tests (20 tests, Chromium only, 10 workers)'
        working-directory: ./frontend
        env:
          FORCE_COLOR: 1
          PYTHONUNBUFFERED: 1
          NODE_ENV: test
        run: |
          echo "🎯 Starting Integration Tests (20 tests on 10 workers)"
          echo "====================================================="
          npx playwright test tests/integration/ --project=chromium --reporter=list --reporter=html
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

