name: Frontend Integration Tests

on:
  push:
    branches:
      - feature/frontend-development
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-tests.yml'

jobs:
  # ==================== INTEGRATION TESTS ====================
  test-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install --legacy-peer-deps

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: '🔍 DIAGNOSTIC: Check Frontend Build & Structure'
        working-directory: ./frontend
        run: |
          echo "🔍 DIAGNOSTIC INFORMATION"
          echo "=========================================="
          echo ""
          echo "📁 Frontend build output:"
          ls -la dist/ || echo "⚠️ dist/ not found"
          echo ""
          echo "📄 Index.html exists:"
          test -f dist/index.html && echo "✅ YES" || echo "❌ NO"
          echo ""
          echo "🔧 Node version:"
          node --version
          echo ""
          echo "📦 npm version:"
          npm --version
          echo ""
          echo "✅ Playwright version:"
          npx playwright --version
          echo ""
          echo "📋 Environment variables (test-related):"
          env | grep -E "NODE_|PLAYWRIGHT_|DEBUG_|CI_|BASE_URL_|API_" || echo "⚠️ No test env vars set"
          echo ""
          echo "🌐 Checking if localhost services would work (in CI, they won't - this is expected):"
          echo "  http://localhost:3002 (frontend) - Only works in local dev"
          echo "  http://localhost:3001 (backend) - Only works in local dev"
          echo ""
          echo "=========================================="

      - name: '🎯 Run Integration Tests (50 tests: 30 happy path + 20 error scenarios)'
        working-directory: ./frontend
        env:
          FORCE_COLOR: 1
          PYTHONUNBUFFERED: 1
          NODE_ENV: test
          DEBUG: pw:api
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:3002
        run: |
          echo "🎯 Starting Integration Tests"
          echo "=========================================="
          echo "📊 Test Configuration:"
          echo "  - Total Tests: 50"
          echo "  - Happy Path: 30 (form submission, API calls, data display)"
          echo "  - Error Scenarios: 20 (validation, auth errors, network failures)"
          echo "  - Browser: Chromium only"
          echo "  - Workers: 10 parallel"
          echo "  - Timeout: 30 seconds per test"
          echo "=========================================="
          echo ""
          echo "🚀 Running tests with detailed output..."
          echo ""
          
          # Run tests with verbose output AND save to JSON
          npx playwright test tests/integration/ \
            --project=chromium \
            --reporter=list \
            --reporter=html \
            --reporter=json \
            --reporter=junit \
            2>&1 | tee test-output.log
          
          TEST_EXIT=$?
          
          echo ""
          echo "=========================================="
          echo "📊 TEST RESULTS SUMMARY"
          echo "=========================================="
          
          # Show test results file if it exists
          if [ -f "test-results.json" ]; then
            echo "✅ Test results saved to: test-results.json"
            cat test-results.json | jq '.stats // empty' 2>/dev/null && echo "" || true
          fi
          
          # Count pass/fail from output
          echo ""
          echo "📋 Test Execution Details:"
          PASSED=$(grep -c "✓" test-output.log || echo "0")
          FAILED=$(grep -c "×" test-output.log || echo "0")
          SKIPPED=$(grep -c "⊘" test-output.log || echo "0")
          
          echo "  ✅ Passed: $PASSED"
          echo "  ❌ Failed: $FAILED"
          echo "  ⊘ Skipped: $SKIPPED"
          echo ""
          
          # Show first 20 lines of test output
          echo "📝 Test Output (first 30 lines):"
          echo "---"
          head -n 30 test-output.log
          echo "---"
          echo ""
          
          # Show failed tests if any
          if [ $FAILED -gt 0 ]; then
            echo "❌ FAILED TESTS DETAILS:"
            echo "---"
            grep -A 5 "×" test-output.log | head -n 50 || echo "Could not extract failure details"
            echo "---"
            echo ""
            echo "📌 Full output saved to: test-output.log"
            echo "📌 HTML report available at: playwright-report/index.html"
          fi
          
          echo "=========================================="
          echo ""
          
          exit $TEST_EXIT
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-output.log
            frontend/test-results.json
            frontend/junit.xml
          retention-days: 7

      - name: '📊 Display Test Summary'
        if: always()
        working-directory: ./frontend
        run: |
          echo ""
          echo "=========================================="
          echo "✅ TEST ARTIFACTS SAVED"
          echo "=========================================="
          echo ""
          echo "📌 Available artifacts:"
          echo "  - playwright-report/ (interactive HTML report)"
          echo "  - test-output.log (full test output)"
          echo "  - test-results.json (JSON format results)"
          echo "  - junit.xml (JUnit format for CI integration)"
          echo ""
          echo "Download artifacts from GitHub Actions tab"
          echo "=========================================="

