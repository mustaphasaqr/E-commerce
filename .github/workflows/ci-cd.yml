name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run pipeline on (leave empty for default branch)'
        required: false
        default: ''
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/ecommerce-app
  JAVA_VERSION: '21'

jobs:
  # ==================== STAGE 1: BUILD ====================
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    services:
      redis:
        image: redis:7.2-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      SPRING_PROFILES_ACTIVE: test
      JWT_SECRET: test-secret-key-minimum-256-bits-for-hmac-sha256-algorithm-testing-only-not-for-production
      JWT_EXPIRATION_MS: 3600000
      JWT_REFRESH_EXPIRATION_MS: 2592000000
      JWT_ENABLED: "true"
      SENDGRID_API_KEY: test-key-12345
      SPRING_REDIS_HOST: localhost
      SPRING_REDIS_PORT: 6379
      # Allow test data seeding and security config override
      TEST_MODE: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Run Maven tests
        run: |
          mvn clean test \
            -B \
            -Dspring.profiles.active=test \
            -DargLine="-Xmx1g -XX:+UseG1GC" \
            --fail-at-end \
            -q 2>&1 | tee test-output.log
        continue-on-error: false
        timeout-minutes: 20

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            target/surefire-reports/
            test-output.log
          retention-days: 30

      - name: Check test results
        if: always()
        run: |
          if [ -f target/surefire-reports/TEST-*.xml ]; then
            FAILED=$(grep -m1 'failures=' target/surefire-reports/TEST-*.xml | grep -oP 'failures="\K[0-9]+' || echo 0)
            ERRORS=$(grep -m1 'errors=' target/surefire-reports/TEST-*.xml | grep -oP 'errors="\K[0-9]+' || echo 0)
            if [ "$FAILED" != "0" ] || [ "$ERRORS" != "0" ]; then
              echo "❌ Tests failed: $FAILED failures, $ERRORS errors"
              exit 1
            fi
            echo "✅ All tests passed"
          fi

      - name: Build Maven project
        run: mvn clean package -DskipTests -B

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== STAGE 2: TEST ====================
  test:
    name: Security & Quality Checks
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Run SonarQube analysis (Optional - requires SonarQube token)
        run: |
          echo "SonarQube analysis skipped - requires configuration"
          echo "To enable: Add SONAR_TOKEN to secrets and uncomment below"

      - name: Check for security vulnerabilities
        run: mvn org.owasp:dependency-check-maven:check -B || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  # ==================== STAGE 3: MANUAL APPROVAL (PRODUCTION GATE) ====================
  approve-production:
    name: 🔐 Approve Production Deployment
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    environment:
      name: production
      url: https://e-commerce-production-27b3.up.railway.app

    steps:
      - name: ⏸️ Waiting for Production Approval
        run: |
          echo "=========================================="
          echo "🔐 PRODUCTION DEPLOYMENT APPROVAL REQUIRED"
          echo "=========================================="
          echo ""
          echo "Build and tests have passed successfully!"
          echo "Waiting for manual approval to deploy to production..."
          echo ""
          echo "Review Details:"
          echo "  Repository: ${{ github.repository }}"
          echo "  Branch: ${{ github.ref }}"
          echo "  Commit: ${{ github.sha }}"
          echo "  Author: ${{ github.actor }}"
          echo ""
          echo "To approve: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "Click 'Review deployments' → Select 'production' → Approve"
          echo "=========================================="

  # ==================== STAGE 4: DEPLOY TO PRODUCTION ====================
  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: approve-production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Notify Railway Deployment
        run: |
          echo "=========================================="
          echo "✅ DEPLOYING TO PRODUCTION"
          echo "=========================================="
          echo ""
          echo "Deployment Details:"
          echo "  Environment: Production (Railway)"
          echo "  Application: e-commerce-production-27b3"
          echo "  URL: https://e-commerce-production-27b3.up.railway.app"
          echo "  Deployment Time: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          echo "Status: Railway auto-deploy triggered on push to main"
          echo "Monitor deployment: https://railway.app"
          echo "=========================================="

      - name: ✅ Verify Production Deployment
        run: |
          echo "Waiting for Railway deployment to complete..."
          echo "This may take 2-5 minutes..."
          sleep 30
          
          # Check health endpoint
          for i in {1..60}; do
            echo "Health check attempt $i/60..."
            if curl -s -f https://e-commerce-production-27b3.up.railway.app/actuator/health | grep -q '"status":"UP"'; then
              echo "✅ Production deployment verified - application is UP"
              curl -s https://e-commerce-production-27b3.up.railway.app/actuator/health | jq .
              exit 0
            fi
            sleep 5
          done
          
          echo "⚠️ Health check timed out - deployment may still be in progress"
          echo "Check Railway logs for details: https://railway.app"

      - name: 📢 Deployment Success Notification
        if: success()
        run: |
          echo "✅ Production deployment completed successfully!"
          echo ""
          echo "Access your application:"
          echo "  URL: https://e-commerce-production-27b3.up.railway.app"
          echo "  Health: https://e-commerce-production-27b3.up.railway.app/actuator/health"
          echo "  API Docs: https://e-commerce-production-27b3.up.railway.app/swagger-ui.html"
