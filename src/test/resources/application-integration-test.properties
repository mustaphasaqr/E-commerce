# Integration Test Configuration (for CI/CD with real services)
# This profile is activated in GitHub Actions to test with real MySQL and Redis

# ========== Database Configuration ==========
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway disabled for integration tests (use Hibernate create-drop)
spring.flyway.enabled=false

# ========== Redis Configuration for Integration Tests ==========
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=2000
spring.data.redis.jedis.pool.max-active=10
spring.data.redis.jedis.pool.max-idle=5
spring.data.redis.jedis.pool.min-idle=2

# Spring Cache enabled for Redis integration tests
spring.cache.type=redis

# ========== Security Configuration for Tests ==========
# JWT configuration - test keys
jwt.secret=test-secret-key-for-testing-purposes-only-12345
jwt.expiration=86400000

# Disable SSL for testing
server.ssl.enabled=false

# ========== Logging ==========
logging.level.com.mustapha.ecommerce=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=INFO

# ========== Email Configuration for Tests ==========
spring.mail.host=smtp.mailtrap.io
spring.mail.port=465
spring.mail.username=test
spring.mail.password=test

# SendGrid
sendgrid.api.key=test-key-12345

# ========== Server Configuration ==========
server.port=8080
server.servlet.context-path=/api

# ========== Actuator ==========
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always
