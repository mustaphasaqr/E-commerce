# ========== Resilience4j Configuration for Tests ==========
# Payment Service (Critical Path)
resilience4j.circuitbreaker.instances.paymentService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.paymentService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.paymentService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.paymentService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.paymentService.waitDurationInOpenState=10s

resilience4j.retry.instances.paymentService.maxAttempts=3
resilience4j.retry.instances.paymentService.waitDuration=1000ms
resilience4j.retry.instances.paymentService.exponentialBackoffMultiplier=2

resilience4j.bulkhead.instances.paymentService.maxConcurrentCalls=50

# Email Service (Non-Critical)
resilience4j.circuitbreaker.instances.emailService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.emailService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.emailService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.emailService.failureRateThreshold=60
resilience4j.circuitbreaker.instances.emailService.waitDurationInOpenState=30s

resilience4j.retry.instances.emailService.maxAttempts=3
resilience4j.retry.instances.emailService.waitDuration=500ms

resilience4j.bulkhead.instances.emailService.maxConcurrentCalls=20

# Product Service  
resilience4j.circuitbreaker.instances.productService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.productService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.productService.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.productService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.productService.waitDurationInOpenState=1s

resilience4j.retry.instances.productService.maxAttempts=2
resilience4j.retry.instances.productService.waitDuration=100ms

# ========== JWT Configuration for Tests ==========
jwt.secret=test-secret-key-minimum-256-bits-for-hmac-sha256-algorithm-testing-only-not-for-production
jwt.expiration-ms=3600000
jwt.refresh-expiration-ms=2592000000

# Random port to avoid conflicts during parallel test execution
server.port=0

# ========== Tawk.to Configuration for Tests ==========
tawk.property-id=test-property-id-12345
tawk.api-key=test-api-key-67890
