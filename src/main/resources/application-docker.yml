# Docker-specific configuration for containerized deployment
# This profile is used when running in Docker containers

spring:
  application:
    name: E-commerce-Monolith-Docker

  # ========== Database Configuration (Docker) ==========
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/ecommerce?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:ecommerce_user}
    password: ${DB_PASSWORD:ecommerce_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver

    # Optimized for containerized environment
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: EcommerceDockerHikariCP
      leak-detection-threshold: 60000

  # ========== Redis Configuration (Docker) ==========
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:ecommerce_redis_pass}
      timeout: 60000
      jedis:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
          max-wait: -1ms

  # ========== JPA Configuration ==========
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  # ========== Flyway Configuration ==========
  flyway:
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: false

# ========== Server Configuration ==========
server:
  port: 8080
  servlet:
    context-path: /

# ========== Logging Configuration ==========
logging:
  level:
    com.mustapha.ecommerce: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ========== Management/Actuator Configuration ==========
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true

# ========== Cache Configuration ==========
cache:
  type: redis
  redis:
    time-to-live: 3600000

# ========== Resilience4j Configuration ==========
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5000
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 2000
  ratelimiter:
    configs:
      default:
        limitForPeriod: 10
        limitRefreshPeriod: 1000
        timeoutDuration: 0
        registerHealthIndicator: true

# ========== External API Configurations ==========
# These should be configured via environment variables in production
external:
  apis:
    enabled: ${EXTERNAL_APIS_ENABLED:false}
    aramex:
      base-url: ${ARAMEX_BASE_URL:https://ws.aramex.net}
      username: ${ARAMEX_USERNAME:}
      password: ${ARAMEX_PASSWORD:}
      account-number: ${ARAMEX_ACCOUNT_NUMBER:}
      account-pin: ${ARAMEX_ACCOUNT_PIN:}
      account-entity: ${ARAMEX_ACCOUNT_ENTITY:}
      account-country-code: ${ARAMEX_ACCOUNT_COUNTRY_CODE:}
    sendgrid:
      api-key: ${SENDGRID_API_KEY:}
      from-email: ${SENDGRID_FROM_EMAIL:}
    hyperpay:
      base-url: ${HYPERPAY_BASE_URL:}
      entity-id: ${HYPERPAY_ENTITY_ID:}
      access-token: ${HYPERPAY_ACCESS_TOKEN:}