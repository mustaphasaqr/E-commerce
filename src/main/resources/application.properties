# Monolith Configuration
# Single application - both Order and Product bounded contexts in same JVM
# Communication: ProductServiceAdapter (direct calls) + Spring Events (in-memory)

spring.application.name=E-commerce-Monolith
server.port=8080

# ========== MySQL Database Configuration ==========
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Configuration
# Adjust these based on expected load and available database connections
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=20
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=EcommerceHikariCP

# Connection pool monitoring (for production observability)
spring.datasource.hikari.leak-detection-threshold=60000

# JPA Configuration
# Use 'update' to let Hibernate manage schema (Flyway disabled due to failed migration issue)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ========== Flyway Database Migration ==========
# DISABLED: Failed migration v1.1 is locked in database schema history
# Using Hibernate ddl-auto=update instead for schema management
spring.flyway.enabled=false

# ========== Redis Configuration ==========
# Production: Use password-protected Redis with volume persistence
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:ecommerce_redis_pass}
spring.data.redis.timeout=60000
spring.data.redis.jedis.pool.max-active=50
spring.data.redis.jedis.pool.max-idle=20
spring.data.redis.jedis.pool.min-idle=5
spring.data.redis.jedis.pool.max-wait=-1ms

# Spring Cache
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

# ========== Logging Configuration ==========
logging.level.root=WARN
logging.level.org.springframework.boot=WARN
logging.level.org.springframework.context=WARN
logging.level.com.mustapha.ecommerce=INFO

# ========== Resilience4j Configuration ==========
# Pattern: Circuit Breaker + Retry + Bulkhead
# Purpose: Prevent cascade failures, handle transient errors, resource isolation

# ---------- Payment Service Resilience ----------
# Critical: Payment operations must be resilient and idempotent
resilience4j.circuitbreaker.instances.paymentService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.paymentService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.paymentService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.paymentService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.paymentService.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.paymentService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.paymentService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.paymentService.slowCallRateThreshold=50
resilience4j.circuitbreaker.instances.paymentService.slowCallDurationThreshold=3s
resilience4j.circuitbreaker.instances.paymentService.eventConsumerBufferSize=10

# Retry configuration: 3 attempts with exponential backoff
resilience4j.retry.instances.paymentService.maxAttempts=3
resilience4j.retry.instances.paymentService.waitDuration=1000ms
resilience4j.retry.instances.paymentService.enableExponentialBackoff=true
resilience4j.retry.instances.paymentService.exponentialBackoffMultiplier=2
resilience4j.retry.instances.paymentService.retryExceptions=java.net.SocketTimeoutException,java.io.IOException,org.springframework.web.client.ResourceAccessException

# Bulkhead: Limit concurrent payment operations
resilience4j.bulkhead.instances.paymentService.maxConcurrentCalls=50
resilience4j.bulkhead.instances.paymentService.maxWaitDuration=100ms

resilience4j.timelimiter.instances.paymentService.timeoutDuration=5s

# ---------- Email Service Resilience ----------
# Non-critical: Email failures should not block user operations
resilience4j.circuitbreaker.instances.emailService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.emailService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.emailService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.emailService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.emailService.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.emailService.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.emailService.failureRateThreshold=60
resilience4j.circuitbreaker.instances.emailService.eventConsumerBufferSize=10

# Retry: More aggressive for transient SMTP failures
resilience4j.retry.instances.emailService.maxAttempts=3
resilience4j.retry.instances.emailService.waitDuration=2000ms
resilience4j.retry.instances.emailService.enableExponentialBackoff=true
resilience4j.retry.instances.emailService.exponentialBackoffMultiplier=2

# Bulkhead: Lower priority, fewer resources
resilience4j.bulkhead.instances.emailService.maxConcurrentCalls=20
resilience4j.bulkhead.instances.emailService.maxWaitDuration=50ms

resilience4j.timelimiter.instances.emailService.timeoutDuration=10s

# ---------- Shipping Service Resilience (Aramex) ----------
# Semi-critical: Shipping operations should be resilient but can fall back to manual
resilience4j.circuitbreaker.instances.shippingService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.shippingService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.shippingService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.shippingService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.shippingService.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.shippingService.waitDurationInOpenState=20s
resilience4j.circuitbreaker.instances.shippingService.failureRateThreshold=55
resilience4j.circuitbreaker.instances.shippingService.slowCallRateThreshold=55
resilience4j.circuitbreaker.instances.shippingService.slowCallDurationThreshold=5s
resilience4j.circuitbreaker.instances.shippingService.eventConsumerBufferSize=10

# Retry: Shipping API can be slow, give it more time
resilience4j.retry.instances.shippingService.maxAttempts=3
resilience4j.retry.instances.shippingService.waitDuration=1500ms
resilience4j.retry.instances.shippingService.enableExponentialBackoff=true
resilience4j.retry.instances.shippingService.exponentialBackoffMultiplier=2
resilience4j.retry.instances.shippingService.retryExceptions=java.net.SocketTimeoutException,java.io.IOException,org.springframework.web.client.ResourceAccessException

# Bulkhead: Moderate concurrent shipments
resilience4j.bulkhead.instances.shippingService.maxConcurrentCalls=30
resilience4j.bulkhead.instances.shippingService.maxWaitDuration=100ms

resilience4j.timelimiter.instances.shippingService.timeoutDuration=15s

# ---------- Product Service Resilience (existing) ----------
resilience4j.circuitbreaker.instances.productService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.productService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.productService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.productService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.productService.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.productService.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.productService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.productService.eventConsumerBufferSize=10

resilience4j.retry.instances.productService.maxAttempts=3
resilience4j.retry.instances.productService.waitDuration=500ms

resilience4j.bulkhead.instances.productService.maxConcurrentCalls=100
resilience4j.bulkhead.instances.productService.maxWaitDuration=100ms

resilience4j.timelimiter.instances.productService.timeoutDuration=4s

# ========== JWT Configuration ==========
# CRITICAL: Use environment variables in production!
# Generate strong secret: openssl rand -base64 64
jwt.secret=${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-use-env-variable-for-security}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}

# ========== Security Configuration ==========
# Password Breach Checking (HIBP API)
# Set to false if:
# - HIBP is blocked in your region
# - API latency is too high (Egypt/MENA might be slower)
# - Privacy concerns
security.password-breach-check.enabled=${PASSWORD_BREACH_CHECK_ENABLED:true}

# ========== Owner Bootstrap (No Migration) ==========
# Creates/repairs OWNER account on startup when enabled.
# IMPORTANT: Set OWNER_BOOTSTRAP_PASSWORD via environment variable.
app.owner.bootstrap.enabled=${OWNER_BOOTSTRAP_ENABLED:true}
app.owner.bootstrap.email=${OWNER_BOOTSTRAP_EMAIL:owner@mecommerce.com}
app.owner.bootstrap.username=${OWNER_BOOTSTRAP_USERNAME:owner}
app.owner.bootstrap.password=${OWNER_BOOTSTRAP_PASSWORD:OwN3r!2026#Secure}

# ========== Spring Boot Actuator ==========
management.health.defaults.enabled=true
management.health.redis.enabled=true

# ========== Server Configuration (Production Hardening) ==========
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.tomcat.connection-timeout=20000
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
spring.mvc.async.request-timeout=30000

# ========== External Services Configuration ==========

# ===== Email Service (SendGrid) =====
# Free Tier: 100 emails/day
# Sign up: https://signup.sendgrid.com
# Get API key: https://app.sendgrid.com/settings/api_keys
email.enabled=true
email.sendgrid.api-key=${SENDGRID_API_KEY:}
email.sendgrid.from-email=${SENDGRID_FROM_EMAIL:noreply@example.com}
email.sendgrid.from-name=${SENDGRID_FROM_NAME:E-commerce Platform}

# ===== Payment Gateway (Accept / Paymob - Egypt, Saudi Arabia, UAE) =====
# Register: https://accept.paymob.com/portal/en/register
# Supports: Visa, Mastercard, Mada, Fawry Pay, Installments
# Multi-country: Egypt, Saudi Arabia, UAE, and more
payment.enabled=true
payment.sandbox-mode=true
payment.accept.api-key=${ACCEPT_API_KEY:}
payment.accept.integration-id=${ACCEPT_INTEGRATION_ID:}
payment.accept.base-url=${ACCEPT_BASE_URL:https://accept.paymob.com/api}

# ===== Shipping Provider (Aramex - MENA Region) =====
# Register: https://www.aramex.com/solutions/developers
# Coverage: Egypt, UAE, Saudi Arabia, Kuwait, Qatar, Bahrain, Oman, Jordan, Lebanon, etc.
# Services: Express, Standard, Cash on Delivery, International
# Get credentials: Aramex Developer Portal → API Credentials
shipping.enabled=true
shipping.aramex.username=${ARAMEX_USERNAME:}
shipping.aramex.password=${ARAMEX_PASSWORD:}
shipping.aramex.account-number=${ARAMEX_ACCOUNT_NUMBER:}
shipping.aramex.account-pin=${ARAMEX_ACCOUNT_PIN:}
shipping.aramex.account-entity=${ARAMEX_ACCOUNT_ENTITY:DXB}
shipping.aramex.base-url=${ARAMEX_BASE_URL:https://ws.aramex.net/ShippingAPI.V2}
# Default sender address (warehouse/fulfillment center)
shipping.aramex.sender-name=${ARAMEX_SENDER_NAME:E-commerce Platform}
shipping.aramex.sender-company=${ARAMEX_SENDER_COMPANY:Your Company Name}
shipping.aramex.sender-address1=${ARAMEX_SENDER_ADDRESS1:}
shipping.aramex.sender-address2=${ARAMEX_SENDER_ADDRESS2:}
shipping.aramex.sender-city=${ARAMEX_SENDER_CITY:}
shipping.aramex.sender-state=${ARAMEX_SENDER_STATE:}
shipping.aramex.sender-postal-code=${ARAMEX_SENDER_POSTAL_CODE:}
shipping.aramex.sender-country=${ARAMEX_SENDER_COUNTRY:AE}
shipping.aramex.sender-phone=${ARAMEX_SENDER_PHONE:}
shipping.aramex.sender-email=${ARAMEX_SENDER_EMAIL:}

# ===== PRODUCTION TODO: Package Dimensions Configuration =====
# Default package dimensions when actual product dimensions are not available
# Used by ShipOrderUseCase to create shipments
# Reference: See SHIPPING_TODO.md Section 4
# TODO: Uncomment and configure these when implementing PackageConfig
#shipping.default-package-length=30.0
#shipping.default-package-width=20.0
#shipping.default-package-height=15.0
# Package sizing strategy: FIXED (use defaults), CALCULATED (from items), AUTO (smart selection)
#shipping.package-sizing-strategy=FIXED

# ===== File Storage (AWS S3) =====
# Free Tier: 5GB storage, 20k GET, 2k PUT requests/month
# Sign up: https://aws.amazon.com/free
storage.enabled=true
storage.max-file-size-mb=5
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:}
aws.s3.region=${AWS_REGION:eu-central-1}

# ===== SMS Service (Twilio) - Optional =====
# Free Trial: $15 credit (~500 SMS)
# Sign up: https://www.twilio.com/try-twilio
sms.enabled=true
sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
sms.twilio.phone-number=${TWILIO_PHONE_NUMBER:}

# ========== NEW FEATURES CONFIGURATION ==========

# ===== Tax Calculation (Middle East Markets) =====
# VAT/GST rates by country (configurable per market)
tax.egypt.vat-rate=0.14
tax.uae.vat-rate=0.05
tax.saudi.vat-rate=0.15
tax.bahrain.vat-rate=0.10
tax.kuwait.vat-rate=0.00
tax.oman.vat-rate=0.05
tax.qatar.vat-rate=0.00

# ===== Customer Support (Tawk.to) =====
# FREE live chat - Sign up: https://www.tawk.to
# Get credentials: Administration → Property Settings → API Key
tawk.property-id=${TAWK_PROPERTY_ID:}
tawk.api-key=${TAWK_API_KEY:}

# ===== Inventory Management =====
inventory.low-stock-threshold=10
inventory.reservation-timeout=15m
inventory.cleanup-schedule=0 */5 * * * *

# ===== Prometheus Metrics & Monitoring =====
# Exposes metrics at: http://localhost:8080/actuator/prometheus
# Grafana dashboards: Import ID 12900 (Spring Boot) and 4701 (JVM Micrometer)

# ===== Actuator Endpoints Configuration =====
# Comprehensive observability endpoints for production monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus,caches,circuitbreakers,threaddump,heapdump,loggers,beans,mappings,env,scheduledtasks,conditions
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.endpoint.caches.enabled=true
management.endpoint.circuitbreakers.enabled=true
management.endpoint.threaddump.enabled=true
management.endpoint.heapdump.enabled=true
management.endpoint.loggers.enabled=true
management.endpoint.beans.enabled=true
management.endpoint.mappings.enabled=true
management.endpoint.env.enabled=true
management.endpoint.scheduledtasks.enabled=true
management.endpoint.conditions.enabled=true

# ===== Metrics Configuration =====
management.metrics.export.prometheus.enabled=true
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.enable.tomcat=true
management.metrics.enable.hikaricp=true
management.metrics.enable.cache=true
management.metrics.enable.logback=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ===== Health Indicators Configuration =====
management.health.circuitbreakers.enabled=true
management.health.ratelimiters.enabled=true
management.health.diskspace.enabled=true
management.health.ping.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# ===== Product Search (PostgreSQL Full-Text) =====
# No configuration needed - uses existing database
# For Algolia upgrade: Set algolia.app-id and algolia.api-key
# For Elasticsearch upgrade: Set spring.elasticsearch.uris

# ===== Reviews & Ratings =====
reviews.auto-approve=true
reviews.moderation-enabled=false
reviews.send-reminder-after-days=7

# ===== Abandoned Cart Recovery =====
cart.abandoned-threshold-hours=1
cart.recovery-email-schedule=0 0 * * * *
cart.recovery-discount-code=COMEBACK10
cart.recovery-discount-percentage=10

# ===== Recommendation Engine =====
recommendations.trending-window-days=30
recommendations.max-recommendations=10

# ===== Fraud Detection =====
fraud.high-value-threshold=5000.0
fraud.very-high-value-threshold=10000.0
fraud.low-risk-threshold=30
fraud.high-risk-threshold=70

# ===== Distributed Tracing (Zipkin + Micrometer) =====
# Trace data sent to Zipkin for distributed request tracking
# Zipkin UI: http://localhost:9411
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# ===== Database Performance Monitoring =====
# Slow query detection and logging
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.properties.hibernate.session.events.log=false
logging.level.org.hibernate.stat=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# HikariCP detailed logging
logging.level.com.zaxxer.hikari=DEBUG
logging.level.com.zaxxer.hikari.HikariConfig=DEBUG

# Query execution time logging (logs queries taking > 1 second)
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=1000

# ===== OpenAPI/Swagger Configuration =====
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.default-models-expand-depth=-1
springdoc.show-actuator=false
# Additional configuration for better error handling
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json
springdoc.override-with-generic-response=false
# Debug logging
logging.level.org.springdoc=DEBUG

# ===== Rate Limiting Configuration =====
# Redis-based distributed rate limiting
rate-limiting.enabled=true
rate-limiting.global-limit=100
rate-limiting.analytics-limit=50
rate-limiting.auth-limit=5
rate-limiting.window-seconds=60
