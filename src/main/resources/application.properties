# Monolith Configuration
# Single application - both Order and Product bounded contexts in same JVM
# Communication: ProductServiceAdapter (direct calls) + Spring Events (in-memory)

spring.application.name=E-commerce-Monolith
server.port=8080

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:ecommerce_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# HikariCP Connection Pool Configuration
# Adjust these based on expected load and available database connections
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=20
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=EcommerceHikariCP

# Connection pool monitoring (for production observability)
spring.datasource.hikari.leak-detection-threshold=60000

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Logging
logging.level.com.mustapha.ecommerce=DEBUG
logging.level.org.springframework.context.event=DEBUG
